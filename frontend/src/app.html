<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/icons/favicon.png" />
		<meta name="viewport" content="width=device-width" />
		<title>Attimo</title>
		%sveltekit.head%
		<script>
			(function () {
				const savedTheme = localStorage.getItem('theme') || 'quercus';
				console.log("Theme loaded from localStorage:", savedTheme);
				document.body.setAttribute('data-theme', savedTheme);
				console.log("Theme applied:", document.body.getAttribute('data-theme'));
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents" class="h-full overflow-hidden">%sveltekit.body%</div>
	</body>
</html>
